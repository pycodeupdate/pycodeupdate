[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycodeupdate"
dynamic = ["version"]
description = "Remote updates for deployed Python applications."
readme = "README.md"
requires-python = ">=3.12"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Virati Akiranandhan Reddy" },
]

keywords = [
    "python",
    "updater",
    "software-update",
    "remote-update",
    "automatic-update",
    "application-update",
    "version-management",
    "deployment",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",

    "Typing :: Typed",
]

import-names = [
    "pycodeupdate",
]

dependencies = []

[project.urls]
Homepage = "https://pycodeupdate.github.io/"
Documentation = "https://pycodeupdate.readthedocs.io/"
Repository = "https://github.com/pycodeupdate/pycodeupdate"
Issues = "https://github.com/pycodeupdate/pycodeupdate/issues"
Changelog = "https://pycodeupdate.github.io/changelog/"

[project.scripts]
pycodeupdate = "pycodeupdate.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.hatch.version]
path = "src/pycodeupdate/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycodeupdate"]

[tool.ruff]
src = ["src", "tests"]

target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "A",      # flake8-builtins
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pycodeupdate"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"
